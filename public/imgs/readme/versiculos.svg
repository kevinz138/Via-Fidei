<g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.2214;0.2500;1" dur="28s" repeatCount="indefinite"/><text x="440" y="96" text-anchor="middle" font-family="Georgia, 'Times New Roman', Times, serif" font-size="27" font-style="italic" fill="#f2e8cc">“Permanecei em mim, e eu permanecerei em vós.”</text><text x="440" y="148" text-anchor="middle" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" letter-spacing="3" fill="#c7a45b">— JOÃO 15,4 —</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2500;0.2786;0.4714;0.5000;1" dur="28s" repeatCount="indefinite"/><text x="440" y="84" text-anchor="middle" font-family="Georgia, 'Times New Roman', Times, serif" font-size="27" font-style="italic" fill="#f2e8cc">“A revelação das vossas palavras ilumina</text><text x="440" y="122" text-anchor="middle" font-family="Georgia, 'Times New Roman', Times, serif" font-size="27" font-style="italic" fill="#f2e8cc">e dá inteligência aos pequeninos.”</text><text x="440" y="174" text-anchor="middle" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" letter-spacing="3" fill="#c7a45b">— SALMO 118(119),130 —</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5286;0.7214;0.7500;1" dur="28s" repeatCount="indefinite"/><text x="440" y="84" text-anchor="middle" font-family="Georgia, 'Times New Roman', Times, serif" font-size="27" font-style="italic" fill="#f2e8cc">“Dou graças ao meu Deus todas as vezes</text><text x="440" y="122" text-anchor="middle" font-family="Georgia, 'Times New Roman', Times, serif" font-size="27" font-style="italic" fill="#f2e8cc">que me lembro de vós.”</text><text x="440" y="174" text-anchor="middle" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" letter-spacing="3" fill="#c7a45b">— FILIPENSES 1,3 —</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7500;0.7786;0.9714;1.0000;1" dur="28s" repeatCount="indefinite"/><text x="440" y="84" text-anchor="middle" font-family="Georgia, 'Times New Roman', Times, serif" font-size="27" font-style="italic" fill="#f2e8cc">“O importante na vida não é fazer alguma coisa,</text><text x="440" y="122" text-anchor="middle" font-family="Georgia, 'Times New Roman', Times, serif" font-size="27" font-style="italic" fill="#f2e8cc">mas nascer e deixar-se amar.”</text><text x="440" y="174" text-anchor="middle" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" letter-spacing="3" fill="#c7a45b">— CHIARA CORBELLA PETRILLO —</text></g>
